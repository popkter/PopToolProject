name: Build and Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a GitHub pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6.0.2
      - id: version
        name: Validate release version
        shell: bash
        run: |
          project_version=$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' pyproject.toml)
          [[ "$project_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid project version: $project_version" >&2
            exit 1
          }
          release_version="$(TZ=Asia/Hong_Kong date +%Y-%m-%d)_$project_version"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$release_version" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows x64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          arch: win64_msvc2022_64
          cache: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Create project virtual environment
        run: uv venv --python 3.11 .venv
      - name: Ensure Inno Setup compiler
        run: |
          $candidates = @(
              (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
              (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
          )
          $compiler = (Get-Command "ISCC.exe" -ErrorAction SilentlyContinue).Source
          if (-not $compiler) {
              $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $compiler) { choco install innosetup --yes --no-progress }
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw "Inno Setup compiler was not found" }
          (Split-Path -Parent $compiler) | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and test application
        run: .\packaging\build.ps1 -VersionOverride "${{ needs.prepare.outputs.version }}"
      - name: Prepare stable asset names
        run: |
          New-Item -ItemType Directory -Path dist\release-assets -Force | Out-Null
          Copy-Item "dist\泡泡工具箱.exe" "dist\release-assets\PopTools.exe"
          Copy-Item "dist\泡泡工具箱-Setup.exe" "dist\release-assets\PopTools-Setup.exe"
          $hash = (Get-FileHash "dist\release-assets\PopTools.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("dist\release-assets\PopTools.exe.sha256", "$hash  PopTools.exe`n")
      - if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PopTools-Windows-test-report-${{ needs.prepare.outputs.version }}
          path: build/test-results/pytest.xml
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: PopTools-Windows-${{ needs.prepare.outputs.version }}
          path: dist/release-assets/*
          if-no-files-found: error
          compression-level: 0

  macos:
    name: Build macOS ${{ matrix.arch }}
    needs: prepare
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          cache: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Create project virtual environment
        run: uv venv --python 3.11 .venv
      - name: Build and test application
        run: ./packaging/build.sh --version "${{ needs.prepare.outputs.version }}"
      - name: Prepare stable asset names
        run: |
          mkdir -p dist/release-assets
          cp "dist/泡泡工具箱-macos-${{ matrix.arch }}.zip" \
             "dist/release-assets/PopTools-macos-${{ matrix.arch }}.zip"
          shasum -a 256 "dist/release-assets/PopTools-macos-${{ matrix.arch }}.zip" \
            | awk '{print $1 "  PopTools-macos-${{ matrix.arch }}.zip"}' \
            > "dist/release-assets/PopTools-macos-${{ matrix.arch }}.zip.sha256"
      - if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PopTools-macOS-${{ matrix.arch }}-test-report-${{ needs.prepare.outputs.version }}
          path: build/test-results/pytest-macos-${{ matrix.arch }}.xml
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: PopTools-macOS-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}
          path: dist/release-assets/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [prepare, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: PopTools-*-${{ needs.prepare.outputs.version }}
          path: release-assets
          merge-multiple: true
      - name: Verify OTA checksums
        working-directory: release-assets
        run: sha256sum --check PopTools.exe.sha256 PopTools-macos-arm64.zip.sha256 PopTools-macos-x64.zip.sha256
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          arguments=(
            release create "$RELEASE_TAG"
            "release-assets/PopTools.exe#泡泡工具箱.exe"
            "release-assets/PopTools.exe.sha256#泡泡工具箱.exe.sha256"
            "release-assets/PopTools-Setup.exe#泡泡工具箱-Setup.exe"
            "release-assets/PopTools-macos-arm64.zip#泡泡工具箱-macOS-Apple-Silicon.zip"
            "release-assets/PopTools-macos-arm64.zip.sha256#泡泡工具箱-macOS-Apple-Silicon.zip.sha256"
            "release-assets/PopTools-macos-x64.zip#泡泡工具箱-macOS-Intel.zip"
            "release-assets/PopTools-macos-x64.zip.sha256#泡泡工具箱-macOS-Intel.zip.sha256"
            --repo "$GH_REPO" --target "$RELEASE_TARGET"
            --title "泡泡工具箱 $RELEASE_VERSION" --generate-notes
          )
          [[ "$IS_PRERELEASE" == "true" ]] && arguments+=(--prerelease)
          gh "${arguments[@]}"
