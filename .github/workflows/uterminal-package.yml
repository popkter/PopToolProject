name: UTerminal Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uterminal-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install Qt SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Build, test and package
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          ./scripts/package-uterminal.ps1 -QtRoot $env:QT_ROOT_DIR -InnoCompiler $compiler
      - name: Record installer checksum
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem build/installer/UTerminal-*-win-x64-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one UTerminal installer.' }
          $hash = (Get-FileHash -LiteralPath $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer[0].Name)" | Set-Content build/installer/SHA256SUMS.txt -Encoding ascii
          'Unsigned development installer. Windows 11 shell identity registration requires a trusted signature.' | Set-Content build/installer/BUILD-NOTES.txt -Encoding utf8
      - name: Preserve installer
        uses: actions/upload-artifact@v4
        with:
          name: uterminal-windows-x64-installer
          if-no-files-found: error
          retention-days: 14
          path: build/installer/*
      - name: Preserve validation and dependency records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uterminal-package-validation
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/uterminal-vs/*-results.txt
            build/uterminal-vs/Testing/Temporary/LastTest.log
            build/uterminal-package/resources/licenses/
